# For more information about tox, see https://tox.readthedocs.io/en/latest/
# global settings
[tox]
envlist = py{311,312}-{linux,macos,windows}
isolated_build = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    
[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform = 
    macos: darwin
    linux: linux
    windows: win32
# environment variables that are kept in tox venv
passenv = 
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
# dependencies to install per venv TODO: change torch(vision) versions
deps = 
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/
    pytest-xvfb ; sys_platform == 'linux'
    py311-linux: torch @ https://download.pytorch.org/whl/cpu/torch-1.10.2%2Bcpu-cp37-cp37m-linux_x86_64.whl
    py312-linux: torch @ https://download.pytorch.org/whl/cpu/torch-1.10.2%2Bcpu-cp38-cp38-linux_x86_64.whl
    py311-linux: torchvision @ https://download.pytorch.org/whl/cpu/torchvision-0.11.3%2Bcpu-cp38-cp38-linux_x86_64.whl
    py312-linux: torchvision @ https://download.pytorch.org/whl/cpu/torchvision-0.11.3%2Bcpu-cp39-cp39-linux_x86_64.whl
    {macos,windows}: torch == 1.10.2
    {macos,windows}: torchvision == 0.11.3
    pytorch-lightning == 1.5.9
extras = 
    dev

commands = pytest -v --color=yes --cov=aisegcell --cov-report=xml
