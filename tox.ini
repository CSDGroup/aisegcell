# For more information about tox, see https://tox.readthedocs.io/en/latest/
# global settings
[tox]
envlist = py{312,313}-{linux,macos,windows}
isolated_build = True

[gh-actions]
python =
    3.12: py312
    3.13: py313

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
# environment variables that are kept in tox venv
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
# dependencies to install per venv
deps =
    pytest  # https://docs.pytest.org/en/latest/contents.html
    pytest-cov  # https://pytest-cov.readthedocs.io/en/latest/
    pytest-xvfb ; sys_platform == 'linux'
    py312-linux: torch @ https://download.pytorch.org/whl/cpu/torch-2.9.0+cpu-cp312-cp312-manylinux_2_28_x86_64.whl
    py313-linux: torch @ https://download.pytorch.org/whl/cpu/torch-2.9.0+cpu-cp313-cp313-manylinux_2_28_x86_64.whl
    py312-linux: torchvision @ https://download.pytorch.org/whl/cpu/torchvision-0.24.0+cpu-cp312-cp312-manylinux_2_28_x86_64.whl
    py313-linux: torchvision @ https://download.pytorch.org/whl/cpu/torchvision-0.24.0+cpu-cp313-cp313-manylinux_2_28_x86_64.whl
    {macos,windows}: torch == 2.9.0
    {macos,windows}: torchvision == 0.24.0
    pytorch-lightning == 2.5.5
extras =
    dev

commands = pytest -v --color=yes --cov=aisegcell --cov-report=xml
